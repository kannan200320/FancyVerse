<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Costumes Wishlist - FancyVerse</title>
  <meta name="description" content="View your saved costume rentals, compare party looks, and transfer items directly to your rental cart.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  
  <!-- Theme, Dir, Palette & Font Head Bootstrap to Prevent Bright Flash / FOUC -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('fancy_theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
        var d = localStorage.getItem('fancy_dir');
        if (d) document.documentElement.setAttribute('dir', d);
        var p = localStorage.getItem('fancy_palette');
        if (p && p !== 'default') document.documentElement.setAttribute('data-palette', p);
        var f = localStorage.getItem('fancy_font');
        if (f && f !== 'sans') document.documentElement.setAttribute('data-font', f);
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            theme: {
              main: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              subtle: 'var(--color-bg-subtle)',
              light: 'var(--color-bg-light)',
              card: 'var(--color-bg-card)',
              gold: 'var(--color-gold)',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/styles-switcher.css">
</head>

<body class="font-sans antialiased text-[#271E1A] dark:text-white bg-[#FDFBF9] dark:bg-[#0D0D0E] transition-colors duration-300">
  
  <div id="navbar"></div>

  <!-- HEADER -->
  <section class="pt-32 pb-10 bg-theme-subtle dark:bg-[#151518] border-b border-theme">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-theme-main dark:text-white">
        Your Saved Costumes
      </h1>
      <p class="text-xs sm:text-sm text-theme-muted dark:text-gray-300 mt-1">
        Save your favorite pieces for upcoming galas, festivals, and stage productions.
      </p>
    </div>
  </section>

  <!-- WISHLIST CONTENT -->
  <section class="py-12 bg-white dark:bg-[#121215]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      
      <div class="flex items-center justify-between pb-4 mb-8 border-b border-theme">
        <span class="text-xs font-bold uppercase tracking-wider text-theme-muted dark:text-gray-400" id="wishlistHeaderCount">
          Saved Items (0)
        </span>
        <button onclick="clearAllWishlist()" class="text-xs text-red-600 hover:underline font-semibold">
          <i class="bi bi-trash3"></i> Clear Wishlist
        </button>
      </div>

      <!-- Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="wishlistGrid">
        <!-- Rendered dynamically -->
      </div>

      <!-- Empty State -->
      <div id="emptyWishlistState" class="hidden text-center py-20 space-y-4">
        <div class="w-20 h-20 rounded-full bg-theme-subtle dark:bg-[#202025] flex items-center justify-center mx-auto text-red-500 text-3xl">
          <i class="bi bi-heart"></i>
        </div>
        <h3 class="text-lg font-bold text-theme-main dark:text-white">Your Wishlist is Empty</h3>
        <p class="text-xs text-gray-500 max-w-sm mx-auto">
          Explore our collection and click the heart icon on any costume to keep track of your favorites.
        </p>
        <a href="catalog.html" class="btn-primary-theme text-xs py-3 px-6 inline-block">
          Explore Costumes
        </a>
      </div>

    </div>
  </section>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/styles-switcher.js"></script>
  <script src="js/main.js"></script>

  <script>
    function renderWishlist() {
      const ids = window.store.getWishlist();
      const grid = document.getElementById('wishlistGrid');
      const emptyState = document.getElementById('emptyWishlistState');
      const headerCount = document.getElementById('wishlistHeaderCount');

      if (!grid || !window.db) return;

      const items = window.db.costumes.filter(c => ids.includes(c.id));
      headerCount.textContent = `Saved Items (${items.length})`;

      if (items.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      grid.innerHTML = items.map(c => `
        <div class="theme-card flex flex-col h-full p-4 group relative overflow-hidden">
          <div class="aspect-[4/5] bg-gray-100 dark:bg-black/40 rounded-2xl mb-4 relative overflow-hidden">
            <span class="absolute top-2.5 left-2.5 badge theme-badge-gold text-[9px] font-bold px-2 py-0.5 rounded-full z-10 shadow">
              ${c.badge || c.category}
            </span>

            <button onclick="removeWishlistItem('${c.id}')" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-white/90 dark:bg-black/70 backdrop-blur text-red-600 flex items-center justify-center text-xs z-10 hover:scale-110 transition shadow" title="Remove">
              <i class="bi bi-x-lg"></i>
            </button>

            <a href="costume-details.html?id=${c.id}" class="w-full h-full block">
              <img src="${c.image}" alt="${c.name}" class="w-full h-full object-cover group-hover:scale-108 transition-transform duration-500">
            </a>
          </div>

          <div class="px-1 flex flex-col flex-grow">
            <span class="text-[9px] text-theme-accent uppercase tracking-widest font-bold block">${c.occasion}</span>
            <h4 class="font-bold text-theme-main dark:text-white text-sm mb-1 mt-0.5 truncate">
              <a href="costume-details.html?id=${c.id}" class="hover:text-theme-accent">${c.name}</a>
            </h4>

            <div class="flex items-center justify-between mt-2 pt-2 border-t border-theme mb-4">
              <div class="flex items-center gap-1 text-amber-500 text-xs">
                <i class="bi bi-star-fill"></i>
                <span class="text-theme-main dark:text-white font-bold text-xs">${c.rating}</span>
              </div>
              <div class="text-right">
                <span class="text-xs font-black text-theme-main dark:text-white">$${c.dailyRate}</span>
                <span class="text-[10px] text-gray-400">/day</span>
              </div>
            </div>

            <button onclick="window.store.addToCart('${c.id}'); window.showToast('Added to Rental Cart', 'success');" class="w-full btn-primary-theme text-[11px] py-2.5 rounded-xl font-bold shadow-sm mt-auto">
              <i class="bi bi-bag-plus"></i> Move to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function removeWishlistItem(costumeId) {
      window.store.toggleWishlist(costumeId);
      renderWishlist();
    }

    function clearAllWishlist() {
      localStorage.setItem('fancy_wishlist', '[]');
      window.dispatchEvent(new CustomEvent('wishlistUpdated'));
      renderWishlist();
    }

    renderWishlist();
  </script>
</body>
</html>
