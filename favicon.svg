<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#963409" />
      <stop offset="45%" stop-color="#B7410E" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Luxury Squircle Badge Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />

  <!-- Masquerade Mask Icon -->
  <g filter="url(#dropShadow)">
    <!-- Ornate Mask Body -->
    <path d="M12 28.5 C12 22, 17.5 17.5, 23.5 17.5 C27.5 17.5, 30.2 19.8, 32 23 C33.8 19.8, 36.5 17.5, 40.5 17.5 C46.5 17.5, 52 22, 52 28.5 C52 36.5, 43 43.5, 35 43.5 C33.2 43.5, 32.5 42, 32 42 C31.5 42, 30.8 43.5, 29 43.5 C21 43.5, 12 36.5, 12 28.5 Z" fill="url(#maskGrad)" />
    
    <!-- Left Eye Aperture -->
    <path d="M18.5 29 C18.5 25.5, 22.5 24.2, 26 26.2 C25.8 29.5, 22 31.8, 18.5 29 Z" fill="#652306" />
    
    <!-- Right Eye Aperture -->
    <path d="M45.5 29 C45.5 25.5, 41.5 24.2, 38 26.2 C38.2 29.5, 42 31.8, 45.5 29 Z" fill="#652306" />

    <!-- Crown Feather / Central Gem -->
    <path d="M32 12 C32.8 14.5, 34 16.5, 34 18 C33 18.5, 31 18.5, 30 18 C30 16.5, 31.2 14.5, 32 12 Z" fill="#FFFDF5" />
    <circle cx="32" cy="18.5" r="1.5" fill="#FDE68A" />

    <!-- Festive Sparkles -->
    <path d="M49 16 L50 18 L52 19 L50 20 L49 22 L48 20 L46 19 L48 18 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M15 16 L16 18 L18 19 L16 20 L15 22 L14 20 L12 19 L14 18 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
