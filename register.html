<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create An Account - FancyVerse</title>
  <meta name="description" content="Register for a FancyVerse customer or theatrical production account to enjoy expedited fitting reservations and exclusive gala discounts.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  
  <!-- Theme, Dir, Palette & Font Head Bootstrap to Prevent Bright Flash / FOUC -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('fancy_theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
        var d = localStorage.getItem('fancy_dir');
        if (d) document.documentElement.setAttribute('dir', d);
        var p = localStorage.getItem('fancy_palette');
        if (p && p !== 'default') document.documentElement.setAttribute('data-palette', p);
        var f = localStorage.getItem('fancy_font');
        if (f && f !== 'sans') document.documentElement.setAttribute('data-font', f);
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            theme: {
              main: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              subtle: 'var(--color-bg-subtle)',
              light: 'var(--color-bg-light)',
              card: 'var(--color-bg-card)',
              gold: 'var(--color-gold)',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/styles-switcher.css">
</head>

<body class="font-sans antialiased text-[#271E1A] dark:text-white bg-[#FDFBF9] dark:bg-[#0D0D0E] min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors duration-300">
  
  <a href="index.html" class="fixed top-6 left-6 z-50 flex items-center gap-2 text-xs font-bold text-theme-main dark:text-white bg-white/80 dark:bg-[#151518]/80 backdrop-blur px-4 py-2 rounded-full border border-theme shadow-md hover:border-theme-accent">
    <i class="bi bi-arrow-left"></i> Return to FancyVerse
  </a>

  <div class="w-full max-w-xl bg-white dark:bg-[#151518] rounded-[2.5rem] shadow-2xl border border-theme p-8 sm:p-12 space-y-6 my-10">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-theme-main text-white flex items-center justify-center mx-auto shadow">
        <i class="bi bi-mask text-2xl text-theme-accent"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-theme-main dark:text-white">
        Create Your FancyVerse Vault Account
      </h1>
      <p class="text-xs text-gray-500">
        Unlock priority fitting suites, streamlined deposits, and troupe volume discounts.
      </p>
    </div>

    <!-- Account Type Selector -->
    <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-theme-subtle dark:bg-[#202025]">
      <button type="button" id="typePatronBtn" onclick="selectAccountType('Patron')" class="py-2.5 rounded-xl text-xs font-bold bg-theme-main text-white shadow-sm transition">
        Gala Patron / Individual
      </button>
      <button type="button" id="typeStudioBtn" onclick="selectAccountType('Studio')" class="py-2.5 rounded-xl text-xs font-bold text-theme-muted dark:text-gray-300 hover:text-theme-main transition">
        Theatrical Studio / Troupe
      </button>
    </div>

    <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-theme-muted dark:text-gray-300 mb-1" id="nameLabel">Full Name</label>
        <input type="text" id="regName" required placeholder="Lady Eleanor Vance" class="theme-input text-xs">
      </div>

      <div>
        <label class="block text-xs font-bold text-theme-muted dark:text-gray-300 mb-1">Email Address</label>
        <input type="email" id="regEmail" required placeholder="eleanor@example.com" class="theme-input text-xs">
      </div>

      <div>
        <label class="block text-xs font-bold text-theme-muted dark:text-gray-300 mb-1">Choose Password</label>
        <input type="password" id="regPassword" required placeholder="At least 6 characters..." oninput="checkPassStrength(this.value)" class="theme-input text-xs">
        
        <!-- Strength Meter -->
        <div class="mt-2 flex items-center gap-1.5">
          <div class="h-1 flex-1 rounded-full bg-gray-200 dark:bg-gray-700 overflow-hidden">
            <div id="strengthBar" class="h-full w-0 transition-all duration-300"></div>
          </div>
          <span id="strengthText" class="text-[10px] text-gray-400 font-semibold">Enter password</span>
        </div>
      </div>

      <div class="space-y-2 pt-2 text-xs text-theme-muted dark:text-gray-300">
        <label class="flex items-start gap-2.5 cursor-pointer">
          <input type="checkbox" required class="rounded text-theme-main mt-0.5">
          <span>I agree to the <a href="pricing.html" target="_blank" class="text-theme-accent font-bold hover:underline">Rental & Deposit Terms</a> and verify I am at least 18 years of age.</span>
        </label>
      </div>

      <button type="submit" class="w-full btn-primary-theme text-xs py-3.5 rounded-xl font-bold shadow-lg">
        Create Account & Proceed
      </button>

    </form>

    <div class="pt-4 border-t border-theme text-center text-xs text-gray-500">
      Return to <a href="index.html" class="text-theme-accent font-bold hover:underline">Home Page</a>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/styles-switcher.js"></script>
  <script src="js/main.js"></script>

  <script>
    let accountType = 'Patron';

    function selectAccountType(type) {
      accountType = type;
      const patronBtn = document.getElementById('typePatronBtn');
      const studioBtn = document.getElementById('typeStudioBtn');
      const nameLabel = document.getElementById('nameLabel');

      if (type === 'Patron') {
        patronBtn.className = 'py-2.5 rounded-xl text-xs font-bold bg-theme-main text-white shadow-sm transition';
        studioBtn.className = 'py-2.5 rounded-xl text-xs font-bold text-theme-muted dark:text-gray-300 hover:text-theme-main transition';
        nameLabel.textContent = 'Full Name';
      } else {
        studioBtn.className = 'py-2.5 rounded-xl text-xs font-bold bg-theme-main text-white shadow-sm transition';
        patronBtn.className = 'py-2.5 rounded-xl text-xs font-bold text-theme-muted dark:text-gray-300 hover:text-theme-main transition';
        nameLabel.textContent = 'Company / Troupe Name & Contact';
      }
    }

    function checkPassStrength(pass) {
      const bar = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');

      if (!pass) {
        bar.style.width = '0%';
        text.textContent = 'Enter password';
        return;
      }

      if (pass.length < 6) {
        bar.style.width = '25%';
        bar.className = 'h-full bg-red-500';
        text.textContent = 'Too short';
      } else if (pass.length < 10) {
        bar.style.width = '60%';
        bar.className = 'h-full bg-amber-500';
        text.textContent = 'Good';
      } else {
        bar.style.width = '100%';
        bar.className = 'h-full bg-emerald-500';
        text.textContent = 'Strong security';
      }
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();

      const newUser = {
        name: name,
        email: email,
        role: accountType === 'Studio' ? 'Studio Client' : 'Customer',
        title: accountType === 'Studio' ? 'Troupe Producer' : 'VIP Patron'
      };

      localStorage.setItem('fancy_user', JSON.stringify(newUser));
      window.showToast(`Welcome to FancyVerse, ${name}! Your account is active.`, 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 700);
    }
  </script>
</body>
</html>
