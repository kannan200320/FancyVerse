<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Costume Missing From Wardrobe | FancyVerse</title>
  <meta name="description" content="The costume page or stage scene you are searching for cannot be found in the FancyVerse vault.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  
  <!-- Theme, Dir, Palette & Font Head Bootstrap to Prevent Bright Flash / FOUC -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('fancy_theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
        var d = localStorage.getItem('fancy_dir');
        if (d) document.documentElement.setAttribute('dir', d);
        var p = localStorage.getItem('fancy_palette');
        if (p && p !== 'default') document.documentElement.setAttribute('data-palette', p);
        var f = localStorage.getItem('fancy_font');
        if (f && f !== 'sans') document.documentElement.setAttribute('data-font', f);
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            theme: {
              main: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              subtle: 'var(--color-bg-subtle)',
              light: 'var(--color-bg-light)',
              card: 'var(--color-bg-card)',
              gold: 'var(--color-gold)',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/styles-switcher.css">
</head>

<body class="font-sans antialiased text-[#271E1A] dark:text-white bg-[#FDFBF9] dark:bg-[#0D0D0E] min-h-screen flex flex-col justify-between transition-colors duration-300">
  
  <div id="navbar"></div>

  <!-- 404 HERO CONTENT -->
  <main class="flex-1 flex items-center justify-center py-32 px-4">
    <div class="max-w-2xl mx-auto text-center space-y-6">
      
      <!-- Big Animated Theatrical Mask Icon -->
      <div class="relative inline-block">
        <span class="text-7xl sm:text-9xl font-black text-theme-subtle dark:text-[#202025] select-none block tracking-tighter">
          404
        </span>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-20 h-20 rounded-3xl bg-theme-main text-white flex items-center justify-center shadow-2xl animate-bounce-slow">
            <i class="bi bi-mask text-4xl text-amber-300"></i>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <h1 class="text-2xl sm:text-4xl font-extrabold text-theme-main dark:text-white">
          Costume Missing From The Wardrobe
        </h1>
        <p class="text-xs sm:text-sm text-theme-muted dark:text-gray-400 max-w-md mx-auto leading-relaxed">
          It appears the stage scene or garment page you are seeking has left the spotlight or been archived in our vault.
        </p>
      </div>

      <!-- Quick Search Bar -->
      <div class="max-w-md mx-auto relative pt-2">
        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input type="text" onkeydown="if(event.key==='Enter') window.location.href='catalog.html';" placeholder="Search for masquerade, corsets, armor..." class="theme-input text-xs pl-10 pr-24 py-3 shadow-md">
        <a href="catalog.html" class="absolute right-1.5 top-3.5 bottom-1.5 px-4 bg-theme-main text-white rounded-lg text-xs font-bold hover:bg-theme-secondary transition flex items-center justify-center">
          Search
        </a>
      </div>

      <!-- Quick Action Navigation -->
      <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
        <a href="index.html" class="btn-primary-theme text-xs py-3 px-6 shadow-md">
          <i class="bi bi-house-door"></i> Back to Home Page
        </a>
        <a href="catalog.html" class="btn-outline-theme text-xs py-3 px-6">
          <i class="bi bi-grid-3x3-gap"></i> Explore Costume Catalog
        </a>
        <a href="contact.html" class="px-5 py-3 rounded-xl border border-theme text-xs font-bold hover:bg-theme-subtle">
          Contact Concierge
        </a>
      </div>

    </div>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/styles-switcher.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
